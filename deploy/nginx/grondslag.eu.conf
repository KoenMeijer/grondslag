# Nginx-serverblok voor de VPS. Plaatsen als
# /etc/nginx/sites-available/grondslag.almaconecta.eu (zie docs/deploy.md).
#
# LET OP: het live bestand op de VPS wordt door certbot beheerd (443-blok,
# TLS-regels, redirects). Dit bestand is de kale uitgangsversie voor een
# nieuwe machine — kopieer het NIET over een bestaande installatie heen,
# dan verdwijnt de TLS-config. Wijzigen op een draaiende VPS: ter plekke
# bewerken, `nginx -t`, reload.
#
# Alleen poort 80 hier: certbot --nginx herschrijft dit bestand zelf naar 443
# met de TLS-regels en een http->https-redirect. Dus niet handmatig 443
# toevoegen — dan botst certbot's rewrite met wat er al staat.
#
# grondslag.eu is de canonieke naam; www stuurt permanent door (blok onderaan).
# Het subdomein van de eerste livegang is op 22 jul 2026 opgeruimd — uit nginx,
# uit het certificaat en uit DNS.
#
# Het live bestand en de certbot-map heten nog naar dat oude subdomein: die
# namen zijn een lineage-sleutel, geen betekenisdrager. Hernoemen zou de
# TLS-paden in de config breken zonder dat er iets beter van wordt.
#
# Vereist in het http-blok van /etc/nginx/nginx.conf (staat daar al):
#   limit_req_zone $binary_remote_addr zone=grondslag_ask:10m rate=10r/m;
server {
    server_name grondslag.eu;

    # Productprincipe 4 (privacy van gebruikersvragen): geen toegangslog met
    # IP-adressen. De transparantie-pagina belooft dit expliciet — wie deze
    # regel weghaalt, moet ook die belofte aanpassen. Error-log blijft aan.
    access_log off;

    # Alleen /api/ask begrenzen: die aanroep kost per stuk een Mistral-embedding
    # plus een generatie. De bezoekteller en /health blijven vrij, anders knijpt
    # de limiet normale paginaweergaven af. Rate limiting houdt het IP alleen in
    # geheugen en schrijft niets weg — de privacybelofte blijft dus staan.
    location = /api/ask {
        limit_req zone=grondslag_ask burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8094/ask;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API: prefix /api wordt gestript door de trailing slash in proxy_pass.
    location /api/ {
        proxy_pass http://127.0.0.1:8094/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Al het andere: de Nuxt-frontend.
    location / {
        proxy_pass http://127.0.0.1:3094;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 80;
}

# www stuurt permanent door naar de canonieke naam, met behoud van het pad —
# zo ontstaan er geen twee vindbare versies van dezelfde site. Certbot vult hier
# na `--nginx` de TLS-regels in.
#
# Het subdomein van de eerste livegang stond hier ook in; dat is op 22 jul 2026
# opgeruimd (nginx, certificaat en DNS) omdat niemand het meer gebruikte.
server {
    server_name www.grondslag.eu;
    access_log off;
    return 301 https://grondslag.eu$request_uri;

    listen 80;
}
