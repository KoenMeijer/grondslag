# NL-doorwerking op de primaire brontekst (toegevoegd 21-07-2026). Deze cases
# meten iets anders dan nl-toezicht-uaiv: dáár volstaat de wegwijzer, hier moet
# retrieval de UAIV-artikelen zelf ophalen tussen 900 EU-chunks door. De
# formuleringen wijken bewust af van de corpuswoorden (memorisatie-les,
# docs/eval-aanpak.md): "aanspreekpunt richting Europa" i.p.v. "centraal
# contactpunt", "uittesten" i.p.v. "AI-testomgeving voor regelgeving".
- id: nl-boete-verboden-praktijk
  categorie: nl-doorwerking
  vraag: "Kan een toezichthouder in Nederland een boete opleggen aan een organisatie die een verboden AI-systeem gebruikt?"
  retrieval_refs: ["UAIV artikel 3.7", "In gewone taal — welke boete"]
  grounding_markers: ["bestuurlijke boete"]
  verboden_markers: []
  abstentie: false

- id: nl-taal-documentatie
  categorie: nl-doorwerking
  vraag: "In welke taal moet ik mijn documentatie aanleveren aan de Nederlandse toezichthouder?"
  retrieval_refs: ["UAIV artikel 3.10", "In gewone taal — moet het papierwerk"]
  grounding_markers: ["Nederlands", "Engels"]
  verboden_markers: []
  abstentie: false

- id: nl-aanspreekpunt-europa
  categorie: nl-doorwerking
  vraag: "Welke instantie is in Nederland het aanspreekpunt richting Europa voor de AI-regels?"
  retrieval_refs: ["UAIV artikel 2.3", "In gewone taal — het Nederlandse loket"]
  grounding_markers: ["minister"]
  verboden_markers: ["Rijksinspectie Digitale Infrastructuur"]
  abstentie: false

- id: nl-testomgeving-uittesten
  categorie: nl-doorwerking
  vraag: "Kan ik een AI-systeem in Nederland onder toezicht uittesten voordat ik het op de markt breng?"
  retrieval_refs: ["UAIV artikel 4.1", "In gewone taal — AI eerst veilig uitproberen"]
  grounding_markers: ["markttoezichtautoriteit"]
  verboden_markers: []
  abstentie: false

# --- Categorie "alledaags" (24 jul 2026) -------------------------------------
# Jip-en-Janneke-taal moet geaccepteerd worden: dezelfde kennisvragen als
# hierboven, maar geformuleerd zoals een niet-jurist ze intypt — zonder één
# wetsterm ("bijlage III", "gebruiksverantwoordelijke"). Zelfde verwachte
# bronnen en feiten als de oudercase (het antwoord mag/moet formele termen
# bevatten; de vráág niet). Dit is de meetlat voor de vocabulaire-kloof.

- id: jj-hoogrisico-deadline
  categorie: alledaags
  vraag: "Ons AI-systeem valt straks in de strenge categorie van de nieuwe AI-wet. Wanneer moeten we daar echt klaar voor zijn?"
