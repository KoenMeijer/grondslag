<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Grondslag">
  <!-- Signatuur van het ontwerp in het klein: papier met de okerrand van het
       citaatblok, en de G in een schreefletter zoals de wettekst zelf. -->
